<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassName and ClassList</title>
    <style>
        .grey {
            background-color: #DCDCDC;
            color: #8E1616;
        }

        .black {
            background-color: black;
            color: white;
        }

        .mod {
            font-size: 25px;
            font-style: italic;
            font-weight: 600;
        }

        .align {
            padding: 10px 30px 10px 30px;
            margin: 10px 10px 10px 15px;
            border: 2px solid black;
            border-radius: 5px;
        }

        .arran {
            background-color: black;
            color: orange;
            width: 50%;
            height: 100%;
            /* border-radius: 30%; */
        }

        .red {
            background-color: #5E0006;
            color: #EED9B9;
        }
    </style>
</head>

<body>
    <div class="red">
        <p>This is para one</p>
        <p>Add items</p>
        <ul class="red">
            <li>item one
            </li>
            <li>item two</li>
            <li>item three</li>
            <li>item four</li>
        </ul>
        <span class="grey">This is a span tag</span>
    </div>
    <script src="index.js"></script>
</body>

</html>
